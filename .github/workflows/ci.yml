# GarantíasPro — Integración continua
# En cada cambio: comprobaciones + compilación ofuscada + pruebas en navegador
# (escritorio y móvil). El despliegue lo hace Cloudflare Workers Builds:
#   - ramas distintas de main -> URL de pruebas <rama>-devoluciones.jmd8590.workers.dev
#   - main -> producción
# Recomendado: en GitHub, Settings -> Branches, exigir que el check «test»
# pase antes de fusionar en main.
name: CI

on:
  push:
    branches: [main, 'mejora/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Comprobaciones (sintaxis, secretos, ficheros prohibidos)
        run: npm run check
      - name: Instalar navegador de pruebas
        run: npx playwright install --with-deps chromium
      - name: Pruebas de extremo a extremo
        run: npm test
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: informe-pruebas
          path: test-results/
          retention-days: 7
